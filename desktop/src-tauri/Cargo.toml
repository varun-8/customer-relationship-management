[package]
name = "vasantham-crm-desktop"
version = "1.0.0"
description = "Vasantham Tiles & Sanitary Wares CRM Desktop Application"
authors = ["Vasantham Systems"]
edition = "2021"

[lib]
name = "vasantham_crm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
