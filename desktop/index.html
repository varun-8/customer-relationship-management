<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vasantham Tiles & Sanitary Wares — Customer CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="margin: 0; background-color: #F8FAFC; color: #0F172A; overflow-x: hidden; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;">
    <div id="root">
      <div style="position: fixed; inset: 0; background-color: #F8FAFC; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;">
        <style>
          @keyframes initialSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          @keyframes initialPulse {
            0%, 100% { opacity: 0.8; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
          }
        </style>
        <div style="position: relative; width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
          <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px dashed #93C5FD; animation: initialSpin 6s linear infinite;"></div>
          <div style="width: 54px; height: 54px; border-radius: 18px; background-color: #FFFFFF; border: 1.5px solid #E2E8F0; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.12); animation: initialPulse 2s ease-in-out infinite;">
            <img src="/logo.png" alt="Logo" style="width: 36px; height: 36px; object-fit: contain;" onerror="this.style.display='none'" />
          </div>
        </div>
        <div style="font-size: 18px; font-weight: 800; color: #0F172A; letter-spacing: -0.02em; margin-bottom: 4px;">Vasantham CRM</div>
        <div style="font-size: 12.5px; font-weight: 600; color: #64748B;">Starting showroom workspace...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
